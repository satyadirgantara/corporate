<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Event Audio Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
        }
        
        .editable-title {
            outline: none;
            border-bottom: 1px dashed transparent;
            transition: all 0.3s ease;
        }
        
        .editable-title:hover, .editable-title:focus {
            border-bottom: 1px dashed #38bdf8;
            background-color: rgba(255,255,255,0.05);
            border-radius: 4px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .playing-indicator {
            display: none;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-10 flex flex-col">

    <header class="mb-10 text-center md:text-left">
        <h1 class="text-3xl md:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
            <i class="fas fa-sliders-h mr-3"></i>Corporate Audio Board
        </h1>
        <p class="text-slate-400 text-sm md:text-base">Klik pada nama track untuk mengubah judul. Masukkan URL audio pada kolom yang disediakan. Dilengkapi fitur Fade In/Out otomatis.</p>
    </header>

    <!-- Notifikasi Error (Custom) -->
    <div id="toast" class="fixed top-5 right-5 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg transform transition-transform duration-300 translate-x-full z-50 flex items-center gap-3">
        <i class="fas fa-exclamation-circle"></i>
        <span id="toast-message">Pesan error di sini</span>
    </div>

    <!-- Grid Layout untuk 6 Player -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 flex-grow" id="board-container">
        <!-- Konten akan di-generate via JavaScript untuk mencegah duplikasi kode -->
    </div>

    <footer class="mt-12 text-center text-slate-500 text-sm">
        <p>Data (Judul & URL) tersimpan otomatis di perangkat ini (Local Storage).</p>
    </footer>

    <script>
        const TOTAL_SLOTS = 6;
        const FADE_DURATION = 1500; // ms
        const FADE_STEPS = 30; // jumlah tahapan (interval)
        const FADE_INTERVAL_TIME = FADE_DURATION / FADE_STEPS; // ~50ms per step
        const VOLUME_STEP = 1 / FADE_STEPS;

        const container = document.getElementById('board-container');
        const audioPlayers = {};

        // Inisialisasi DOM untuk 6 Player
        for (let i = 1; i <= TOTAL_SLOTS; i++) {
            // Coba ambil data dari LocalStorage
            const savedData = JSON.parse(localStorage.getItem(`track_${i}`)) || {
                name: `Track ${i}`,
                url: Upbeat_Corporate_Background_Music_Playlist_1_HOUR_for_Videos_Business_Presentations_2024 (mp3cut.net).mp3
                isLooping: false
            };

            const cardHTML = `
                <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl flex flex-col justify-between" id="card-${i}">
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <!-- Judul Editable -->
                            <h2 class="text-xl font-bold text-white editable-title px-1 w-full" 
                                contenteditable="true" 
                                id="title-${i}"
                                onblur="saveData(${i})"
                                title="Klik untuk mengubah nama">${savedData.name}</h2>
                            <div class="playing-indicator" id="indicator-${i}"></div>
                        </div>

                        <!-- Input URL Audio -->
                        <div class="mb-4">
                            <label class="text-xs text-slate-400 mb-1 block">Nama File (di Github) / Pilih File Lokal:</label>
                            <div class="flex gap-2">
                                <input type="text" 
                                    id="url-${i}" 
                                    class="w-full bg-slate-900 border border-slate-600 text-slate-300 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block p-2.5 outline-none transition" 
                                    placeholder="contoh: lagu-masuk.mp3" 
                                    value="${savedData.url}"
                                    onchange="updateAudioSource(${i}); saveData(${i})">
                                <label class="bg-slate-700 hover:bg-slate-600 text-white px-3 rounded-lg cursor-pointer flex items-center justify-center transition border border-slate-600" title="Pilih file audio dari komputer">
                                    <i class="fas fa-folder-open"></i>
                                    <input type="file" id="file-${i}" class="hidden" accept="audio/*" onchange="loadLocalFile(${i}, this)">
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Audio Element (Hidden) -->
                    <audio id="audio-${i}" src="${savedData.url}" ${savedData.isLooping ? 'loop' : ''} preload="metadata"></audio>

                    <!-- Kontrol Player -->
                    <div>
                        <!-- Progress Bar (Visual only) -->
                        <div class="w-full bg-slate-700 rounded-full h-1.5 mb-4 mt-2">
                            <div class="bg-cyan-400 h-1.5 rounded-full transition-all duration-100" style="width: 0%" id="progress-${i}"></div>
                        </div>
                        
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex gap-2">
                                <!-- Tombol Play -->
                                <button onclick="playWithFade(${i})" class="w-10 h-10 bg-cyan-600 hover:bg-cyan-500 text-white rounded-full flex items-center justify-center transition shadow-lg shadow-cyan-900/50" title="Play (Fade In)">
                                    <i class="fas fa-play ml-1"></i>
                                </button>
                                <!-- Tombol Pause -->
                                <button onclick="pauseWithFade(${i})" class="w-10 h-10 bg-slate-600 hover:bg-slate-500 text-white rounded-full flex items-center justify-center transition" title="Pause (Fade Out)">
                                    <i class="fas fa-pause"></i>
                                </button>
                                <!-- Tombol Stop -->
                                <button onclick="stopWithFade(${i})" class="w-10 h-10 bg-red-900/80 hover:bg-red-700 text-white rounded-full flex items-center justify-center transition border border-red-800" title="Stop (Fade Out & Reset)">
                                    <i class="fas fa-stop"></i>
                                </button>
                            </div>
                            
                            <!-- Tombol Loop -->
                            <button onclick="toggleLoop(${i})" id="loop-btn-${i}" class="px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition ${savedData.isLooping ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'}">
                                <i class="fas fa-redo-alt"></i> Loop
                            </button>
                        </div>
                        <div class="text-right mt-2 text-xs text-slate-500 font-mono" id="time-${i}">00:00 / 00:00</div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        }

        // Setup Listener untuk setiap audio (Progress bar & Time update)
        window.onload = () => {
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                const audio = document.getElementById(`audio-${i}`);
                const progressBar = document.getElementById(`progress-${i}`);
                const timeDisplay = document.getElementById(`time-${i}`);
                const indicator = document.getElementById(`indicator-${i}`);

                audioPlayers[i] = {
                    fadeInterval: null,
                    status: 'stopped' // stopped, playing, fading_in, fading_out
                };

                // Update progress visual
                audio.addEventListener('timeupdate', () => {
                    if (audio.duration) {
                        const percent = (audio.currentTime / audio.duration) * 100;
                        progressBar.style.width = `${percent}%`;
                        timeDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
                    }
                });

                // Deteksi lagu selesai secara alami
                audio.addEventListener('ended', () => {
                    indicator.style.display = 'none';
                    audioPlayers[i].status = 'stopped';
                    progressBar.style.width = `0%`;
                    timeDisplay.innerText = `00:00 / ${formatTime(audio.duration)}`;
                });

                // Update durasi saat file di-load
                audio.addEventListener('loadedmetadata', () => {
                    timeDisplay.innerText = `00:00 / ${formatTime(audio.duration)}`;
                });
            }
        };

        // --- Fungsi Kontrol Audio & Gradasi ---

        function playWithFade(id) {
            const audio = document.getElementById(`audio-${id}`);
            const state = audioPlayers[id];
            
            if (!audio.src || audio.getAttribute('src') === "") {
                showToast("URL Audio belum diisi!");
                return;
            }

            // Bersihkan interval sebelumnya jika ada (misal sedang fade-out, lalu di-play lagi)
            if (state.fadeInterval) clearInterval(state.fadeInterval);
            
            document.getElementById(`indicator-${id}`).style.display = 'block';
            state.status = 'fading_in';
            
            // Jika audio sudah selesai, kembalikan ke 0
            if(audio.currentTime >= audio.duration) {
                audio.currentTime = 0;
            }

            // Mulai mainkan dari volume terendah jika belum main
            if (audio.paused) {
                audio.volume = 0;
                audio.play().catch(e => {
                    showToast("Gagal memutar! Pastikan link audio valid dan bisa diakses (CORS/Public).");
                    document.getElementById(`indicator-${id}`).style.display = 'none';
                });
            }

            // Proses Gradasi Naik (Fade In)
            state.fadeInterval = setInterval(() => {
                let newVolume = audio.volume + VOLUME_STEP;
                if (newVolume >= 1) {
                    audio.volume = 1;
                    state.status = 'playing';
                    clearInterval(state.fadeInterval);
                } else {
                    audio.volume = newVolume;
                }
            }, FADE_INTERVAL_TIME);
        }

        function pauseWithFade(id) {
            const audio = document.getElementById(`audio-${id}`);
            const state = audioPlayers[id];

            if (audio.paused && state.status !== 'fading_in') return; // Sudah pause

            if (state.fadeInterval) clearInterval(state.fadeInterval);
            state.status = 'fading_out';

            // Proses Gradasi Turun (Fade Out)
            state.fadeInterval = setInterval(() => {
                let newVolume = audio.volume - VOLUME_STEP;
                if (newVolume <= 0) {
                    audio.volume = 0;
                    audio.pause();
                    state.status = 'stopped';
                    document.getElementById(`indicator-${id}`).style.display = 'none';
                    clearInterval(state.fadeInterval);
                } else {
                    audio.volume = newVolume;
                }
            }, FADE_INTERVAL_TIME);
        }

        function stopWithFade(id) {
            const audio = document.getElementById(`audio-${id}`);
            const state = audioPlayers[id];

            // Jika sudah stop dan pause, cukup reset waktu
            if (audio.paused) {
                audio.currentTime = 0;
                document.getElementById(`progress-${id}`).style.width = '0%';
                return;
            }

            if (state.fadeInterval) clearInterval(state.fadeInterval);
            state.status = 'fading_out';

            // Proses Gradasi Turun lalu Stop (kembali ke detik 0)
            state.fadeInterval = setInterval(() => {
                let newVolume = audio.volume - VOLUME_STEP;
                if (newVolume <= 0) {
                    audio.volume = 0;
                    audio.pause();
                    audio.currentTime = 0; // Reset ke awal
                    state.status = 'stopped';
                    document.getElementById(`indicator-${id}`).style.display = 'none';
                    document.getElementById(`progress-${id}`).style.width = '0%';
                    clearInterval(state.fadeInterval);
                } else {
                    audio.volume = newVolume;
                }
            }, FADE_INTERVAL_TIME);
        }

        // --- Fungsi Tambahan & Utilities ---

        function toggleLoop(id) {
            const audio = document.getElementById(`audio-${id}`);
            const loopBtn = document.getElementById(`loop-btn-${id}`);
            
            audio.loop = !audio.loop;
            
            if (audio.loop) {
                loopBtn.classList.replace('bg-slate-700', 'bg-indigo-600');
                loopBtn.classList.replace('text-slate-400', 'text-white');
                loopBtn.classList.remove('hover:bg-slate-600');
            } else {
                loopBtn.classList.replace('bg-indigo-600', 'bg-slate-700');
                loopBtn.classList.replace('text-white', 'text-slate-400');
                loopBtn.classList.add('hover:bg-slate-600');
            }
            saveData(id);
        }

        function updateAudioSource(id) {
            const audio = document.getElementById(`audio-${id}`);
            const inputUrl = document.getElementById(`url-${id}`).value;
            
            // Hentikan jika sedang play
            if (!audio.paused) {
                stopWithFade(id);
            }
            
            // Set source baru
            setTimeout(() => {
                 audio.src = inputUrl;
                 audio.load();
            }, 300); // beri delay kecil jika sedang fade out stop
        }

        function loadLocalFile(id, inputElement) {
            if (inputElement.files && inputElement.files[0]) {
                const file = inputElement.files[0];
                
                // Buat temporary local URL untuk file yang dipilih
                const objectUrl = URL.createObjectURL(file);
                
                // Masukkan URL sementara ke dalam input text
                const urlInput = document.getElementById(`url-${id}`);
                urlInput.value = objectUrl;
                
                // Otomatis ubah judul sesuai nama file jika judulnya masih "Track X"
                const titleEl = document.getElementById(`title-${id}`);
                if (titleEl.innerText.startsWith('Track')) {
                    titleEl.innerText = file.name.replace(/\.[^/.]+$/, ""); // Hapus ekstensi .mp3
                }
                
                updateAudioSource(id);
                saveData(id);
            }
        }

        function saveData(id) {
            const title = document.getElementById(`title-${id}`).innerText;
            const url = document.getElementById(`url-${id}`).value;
            const isLooping = document.getElementById(`audio-${id}`).loop;

            const data = { name: title, url: url, isLooping: isLooping };
            // Memastikan data tersimpan pada ID yang benar
            localStorage.setItem(`track_${id}`, JSON.stringify(data));
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            
            toast.classList.remove('translate-x-full');
            
            setTimeout(() => {
                toast.classList.add('translate-x-full');
            }, 3000);
        }

        // Menyimpan jika user mengedit judul (Enter key handler)
        document.addEventListener('keydown', (e) => {
            if (e.target.classList.contains('editable-title') && e.key === 'Enter') {
                e.preventDefault();
                e.target.blur(); // Trigger onblur untuk save
            }
        });
    </script>
</body>
</html>
